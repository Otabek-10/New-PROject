<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartEdu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Maket: chapda daftar-varaq kabi yon menyu, o‘ngda katak qog‘ozli ish maydoni.
   Telefonda yon menyu pastki tab-panelga almashadi. */
      :root {
        --bg: #eef2f9;
        --paper: #fbfcff;
        --ink: #141b34;
        --muted: #5b6584;
        --line: #d5dcec;
        --grid: rgba(40, 69, 214, 0.07);
        --soft: #e3e9fa;
        --accent: #2845d6;
        --accent-ink: #ffffff;
        --mark: #ffe066;
        --good: #1e8e5a;
        --bad: #c8362f;
        --warn: #b7791f;
        --s-math: #3b5bdb;
        --s-fizika: #e8590c;
        --s-ingliz: #0c8599;
        --s-info: #7048e8;
        --f-display: "Bricolage Grotesque", "Onest", system-ui, sans-serif;
        --f-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
        --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0c1224;
          --paper: #121a33;
          --ink: #e8ecfa;
          --muted: #98a3c7;
          --line: #26315a;
          --grid: rgba(140, 170, 255, 0.07);
          --soft: #1a2547;
          --accent: #8aa2ff;
          --accent-ink: #0c1224;
          --mark: #7a6a12;
          --good: #4cc38a;
          --bad: #ff7a72;
          --warn: #e5b454;
          --s-math: #8aa2ff;
          --s-fizika: #ff9159;
          --s-ingliz: #4cc9db;
          --s-info: #a992ff;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0c1224;
        --paper: #121a33;
        --ink: #e8ecfa;
        --muted: #98a3c7;
        --line: #26315a;
        --grid: rgba(140, 170, 255, 0.07);
        --soft: #1a2547;
        --accent: #8aa2ff;
        --accent-ink: #0c1224;
        --mark: #7a6a12;
        --good: #4cc38a;
        --bad: #ff7a72;
        --warn: #e5b454;
        --s-math: #8aa2ff;
        --s-fizika: #ff9159;
        --s-ingliz: #4cc9db;
        --s-info: #a992ff;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        color: var(--ink);
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 28px 28px;
        font: 15px/1.6 var(--f-body);
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3 {
        font-family: var(--f-display);
        margin: 0;
        letter-spacing: -0.01em;
        text-wrap: balance;
        line-height: 1.15;
      }
      h1 {
        font-size: clamp(28px, 5vw, 40px);
        font-weight: 800;
      }
      h2 {
        font-size: 20px;
        font-weight: 700;
      }
      h3 {
        font-size: 16px;
        font-weight: 700;
      }
      p {
        margin: 0;
      }
      a {
        color: inherit;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .mk {
        background: linear-gradient(transparent 58%, var(--mark) 58%);
        padding: 0 0.08em;
      }
      .eyebrow {
        font: 500 12px var(--f-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .muted {
        color: var(--muted);
      }
      .mono {
        font-family: var(--f-mono);
        font-variant-numeric: tabular-nums;
      }

      /* qobiq */
      .shell {
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
        min-height: 100vh;
      }
      .side {
        position: sticky;
        top: 0;
        align-self: start;
        height: 100vh;
        padding: 24px 14px;
        display: flex;
        flex-direction: column;
        gap: 26px;
        background: var(--paper);
        border-right: 1px solid var(--line);
      }
      .brand {
        font: 800 24px var(--f-display);
        letter-spacing: -0.02em;
        padding: 0 10px;
        text-decoration: none;
      }
      .brand .mk {
        padding: 0 0.12em;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 9px;
        text-decoration: none;
        color: var(--muted);
        font-weight: 500;
      }
      .nav a svg,
      .tabbar a svg {
        width: 20px;
        height: 20px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav a:hover {
        background: var(--soft);
        color: var(--ink);
      }
      .nav a[aria-current="page"] {
        background: var(--soft);
        color: var(--ink);
        font-weight: 600;
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .side-foot {
        margin-top: auto;
        padding: 0 10px;
      }
      .col {
        min-width: 0;
      }
      .mhead {
        display: none;
      }
      main {
        padding: 30px clamp(16px, 4vw, 48px) 90px;
        max-width: 1000px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .tabbar {
        display: none;
      }

      /* bloklar */
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
        min-width: 0;
      }
      .card.flat {
        background: transparent;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .row.between {
        justify-content: space-between;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .hero {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 4px;
      }
      .lead {
        color: var(--muted);
        font-size: 17px;
        max-width: 56ch;
      }
      .banner {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        border: 1px dashed var(--warn);
        border-radius: 12px;
        padding: 12px 16px;
        background: var(--paper);
        font-size: 14px;
      }
      .banner b {
        font-weight: 600;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 42px;
        padding: 9px 18px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--paper);
        cursor: pointer;
        font-weight: 600;
        text-decoration: none;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.1s;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.primary {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      .btn.primary:hover {
        filter: brightness(1.08);
      }
      .btn.small {
        min-height: 34px;
        padding: 5px 12px;
        font-size: 13px;
      }
      .btn.danger {
        color: var(--bad);
        border-color: var(--bad);
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 500 12px var(--f-mono);
        padding: 3px 9px;
        border-radius: 99px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .pill.high {
        color: var(--good);
        border-color: var(--good);
      }
      .pill.mid {
        color: var(--warn);
        border-color: var(--warn);
      }
      .pill.low {
        color: var(--bad);
        border-color: var(--bad);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--c, var(--accent));
        flex: none;
      }

      .bar {
        height: 8px;
        border-radius: 99px;
        background: var(--soft);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--c, var(--accent));
        border-radius: 99px;
        min-width: 2px;
      }

      .next {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: center;
        background: var(--paper);
        box-shadow: inset 0 -4px 0 var(--accent);
      }
      .next h2 {
        font-size: clamp(22px, 3.4vw, 28px);
      }
      .strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 0;
      }
      .strip > div {
        padding: 4px 20px;
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .strip > div:first-child {
        border-left: 0;
        padding-left: 0;
      }
      .strip .big {
        font: 700 28px var(--f-display);
        font-variant-numeric: tabular-nums;
      }

      .subj {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr) 64px;
        gap: 14px;
        align-items: center;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .subj:first-of-type {
        border-top: 0;
      }
      .subj .name {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
      }

      /* darslar */
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: 99px;
        padding: 6px 14px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
      }
      .chip[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .topics {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 14px;
      }
      .topic {
        display: flex;
        flex-direction: column;
        gap: 12px;
        text-decoration: none;
        position: relative;
        border-top: 4px solid var(--c);
        transition:
          transform 0.15s,
          border-color 0.15s;
      }
      .topic:hover {
        transform: translateY(-2px);
      }
      .topic .t {
        font: 700 18px var(--f-display);
      }
      .topic .meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: auto;
      }
      .lesson p {
        margin: 0 0 14px;
        max-width: 65ch;
        font-size: 16px;
      }
      .lesson .ex {
        border-left: 4px solid var(--mark);
        padding: 2px 0 2px 16px;
        margin: 6px 0;
      }
      .crumb {
        font: 500 12px var(--f-mono);
        color: var(--muted);
        text-decoration: none;
        letter-spacing: 0.04em;
      }
      .crumb:hover {
        color: var(--accent);
      }
      details summary {
        cursor: pointer;
        font-weight: 600;
      }
      details[open] summary {
        margin-bottom: 8px;
      }

      /* test */
      .qtext {
        font: 700 clamp(20px, 3vw, 26px) var(--f-display);
        line-height: 1.25;
        max-width: 30ch;
      }
      .opts {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 560px;
      }
      .opt {
        display: flex;
        gap: 12px;
        align-items: center;
        text-align: left;
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1.5px solid var(--line);
        background: var(--paper);
        cursor: pointer;
        min-height: 48px;
      }
      .opt:hover:not([disabled]) {
        border-color: var(--accent);
      }
      .opt .k {
        font: 500 13px var(--f-mono);
        width: 26px;
        height: 26px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        background: var(--soft);
        flex: none;
      }
      .opt.ok {
        border-color: var(--good);
        background: color-mix(in srgb, var(--good) 12%, var(--paper));
      }
      .opt.no {
        border-color: var(--bad);
        background: color-mix(in srgb, var(--bad) 10%, var(--paper));
      }
      .opt[disabled] {
        cursor: default;
      }
      .why {
        border-radius: 10px;
        padding: 12px 14px;
        background: var(--soft);
        max-width: 560px;
      }
      .steps {
        display: flex;
        gap: 5px;
      }
      .steps i {
        flex: 1;
        height: 6px;
        border-radius: 99px;
        background: var(--soft);
      }
      .steps i.on {
        background: var(--accent);
      }
      .steps i.bad {
        background: var(--bad);
      }
      .steps i.good {
        background: var(--good);
      }
      .ring {
        width: 132px;
        height: 132px;
        flex: none;
      }
      .ring circle {
        fill: none;
        stroke-width: 12;
      }
      .ring .bg {
        stroke: var(--soft);
      }
      .ring .fg {
        stroke: var(--accent);
        stroke-linecap: round;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
      }
      .ring text {
        fill: var(--ink);
        font: 800 28px var(--f-display);
        text-anchor: middle;
      }
      .wrong {
        border-top: 1px solid var(--line);
        padding: 12px 0;
      }
      .wrong:first-child {
        border-top: 0;
      }

      /* natijalar */
      .chartwrap {
        overflow-x: auto;
      }
      .chartwrap svg {
        display: block;
        min-width: 520px;
        width: 100%;
        height: auto;
      }
      .gl {
        stroke: var(--line);
        stroke-width: 1;
      }
      .ax {
        fill: var(--muted);
        font: 11px var(--f-mono);
      }
      .ln {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .ar {
        fill: var(--accent);
        opacity: 0.13;
      }
      .pt {
        fill: var(--paper);
        stroke: var(--accent);
        stroke-width: 2;
      }
      .pt.last {
        fill: var(--accent);
      }
      .vl {
        fill: var(--ink);
        font: 600 12px var(--f-mono);
        text-anchor: middle;
      }
      .tablewrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 420px;
      }
      th,
      td {
        text-align: left;
        padding: 9px 10px;
        border-top: 1px solid var(--line);
        font-size: 14px;
      }
      th {
        font: 500 11px var(--f-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        border-top: 0;
      }
      td.n,
      th.n {
        text-align: right;
        font-family: var(--f-mono);
        font-variant-numeric: tabular-nums;
      }
      .mrow {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 110px;
        gap: 14px;
        align-items: center;
        padding: 9px 0;
        border-top: 1px solid var(--line);
      }
      .mrow:first-child {
        border-top: 0;
      }

      /* profil */
      .avatar {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: var(--accent);
        color: var(--accent-ink);
        display: grid;
        place-items: center;
        font: 800 28px var(--f-display);
        flex: none;
      }
      .form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field label {
        font: 500 12px var(--f-mono);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .field input,
      .field select,
      .field textarea {
        min-height: 42px;
        padding: 8px 12px;
        border-radius: 9px;
        border: 1.5px solid var(--line);
        background: var(--bg);
        width: 100%;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: var(--accent);
        outline: 0;
      }

      /* AI tutor */
      .tutor {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .chat {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 280px;
        max-height: min(58vh, 560px);
        overflow-y: auto;
        padding: 4px 2px;
      }
      .msg {
        max-width: min(620px, 92%);
        padding: 11px 15px;
        border-radius: 14px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .msg.u {
        align-self: flex-end;
        background: var(--accent);
        color: var(--accent-ink);
        border-bottom-right-radius: 4px;
      }
      .msg.a {
        align-self: flex-start;
        background: var(--paper);
        border: 1px solid var(--line);
        border-bottom-left-radius: 4px;
      }
      .msg ul {
        margin: 6px 0;
        padding-left: 20px;
      }
      .msg p + p {
        margin-top: 8px;
      }
      .msg code {
        font-family: var(--f-mono);
        font-size: 0.92em;
        background: var(--soft);
        padding: 1px 5px;
        border-radius: 5px;
        color: var(--ink);
      }
      .msg.u code {
        background: rgba(255, 255, 255, 0.2);
        color: inherit;
      }
      .composer {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      .composer textarea {
        flex: 1;
        min-width: 0;
        resize: none;
        min-height: 46px;
        max-height: 140px;
        padding: 11px 14px;
        border-radius: 12px;
        border: 1.5px solid var(--line);
        background: var(--paper);
      }
      .composer textarea:focus {
        border-color: var(--accent);
        outline: 0;
      }
      .empty {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 26px 6px;
      }
      .note {
        font-size: 13px;
        color: var(--muted);
      }

      .practice-item {
        border-top: 1px solid var(--line);
        padding: 12px 0;
      }
      .practice-item:first-child {
        border-top: 0;
      }
      .fade {
        animation: rise 0.35s ease both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .dots span {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
        margin-right: 4px;
        animation: blink 1s infinite;
      }
      .dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      @media (max-width: 860px) {
        .shell {
          grid-template-columns: minmax(0, 1fr);
        }
        .side {
          display: none;
        }
        .mhead {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 14px max(16px, env(safe-area-inset-left, 0px)) 0
            max(16px, env(safe-area-inset-left, 0px));
        }
        main {
          padding-inline: max(16px, env(safe-area-inset-left, 0px));
          padding-block: 18px 100px;
        }
        .tabbar {
          display: grid;
          grid-template-columns: repeat(6, minmax(0, 1fr));
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 20;
          background: var(--paper);
          border-top: 1px solid var(--line);
          padding: 6px max(6px, env(safe-area-inset-left, 0px))
            calc(6px + env(safe-area-inset-bottom, 0px))
            max(6px, env(safe-area-inset-right, 0px));
        }

        async function makePractice() {
          if (practice.status === "loading") return;

            weak.map((t) => {

              return {
                topic: t.title,
                q:
                  q.q +
                  "  " +
                  q.options.map((o, i) => LETTERS[i] + ") " + o).join("   "),
                hint: "",

                  LETTERS[q.correct] +

                  q.options[q.correct] +
                  ". " +
                  q.why,
              };
            });
          if (!prov) {
            practice.items = local();
            practice.status = "ready";
            refreshPractice();
            return;

          const prompt =
            "O‘quvchi: " +
            (S.profile.name || "noma’lum") +

            "-sinf.\nUning e’tibor talab qiladigan mavzulari:\n" +

          try {
            const txt = await callAI(prov, "", [
              { role: "user", content: prompt },
            ]);
            const arr = parseJSONLoose(txt);
            if (!Array.isArray(arr) || !arr.length) throw { code: "bad_json" };

              .slice(0, 3)

        function chartSVG(pts) {
          const W = 640,
            H = 230,
            L = 36,
            R = 16,
            T = 22,
            B = 30,
            iw = W - L - R,
            ih = H - T - B;
          const x = (i) =>
            L + (pts.length === 1 ? iw / 2 : (i * iw) / (pts.length - 1));
          const y = (v) => T + ih - (v / 100) * ih;
          let g = "";
          [0, 25, 50, 75, 100].forEach((v) => {
            g +=
              '<line class="gl" x1="' +
              L +
              '" x2="' +
              (W - R) +
              '" y1="' +
              y(v) +
              '" y2="' +
              y(v) +
              '"/><text class="ax" x="' +
              (L - 6) +
              '" y="' +
              (y(v) + 4) +
              '" text-anchor="end">' +
              v +
              "</text>";
          });
          const line = pts
            .map(
              (p, i) =>
                (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.pct).toFixed(1),
            )
            .join(" ");
          const area =
            pts.length > 1
              ? '<path class="ar" d="' +
                line +
                " L" +
                x(pts.length - 1).toFixed(1) +
                " " +
                y(0) +
                " L" +
                x(0).toFixed(1) +
                " " +
                y(0) +
                ' Z"/>'
              : "";
          const dots = pts
            .map(
              (p, i) =>
                '<circle class="pt' +
                (i === pts.length - 1 ? " last" : "") +
                '" cx="' +
                x(i).toFixed(1) +
                '" cy="' +
                y(p.pct).toFixed(1) +
                '" r="' +
                (i === pts.length - 1 ? 5 : 4) +
                '"/>',
            )
            .join("");
          const xl = pts
            .map((p, i) =>
              pts.length <= 8 || i % 2 === 0 || i === pts.length - 1
                ? '<text class="ax" x="' +
                  x(i).toFixed(1) +
                  '" y="' +
                  (H - 8) +
                  '" text-anchor="middle">' +
                  p.label +
                  "</text>"
                : "",
            )
            .join("");
          const last = pts[pts.length - 1],
            ly = last.pct >= 90 ? y(last.pct) + 20 : y(last.pct) - 11;
          return (
            '<svg viewBox="0 0 ' +
            W +
            " " +
            H +
            '" role="img" aria-label="Test natijalari dinamikasi">' +
            g +
            area +
            '<path class="ln" d="' +
            line +
            '"/>' +
            dots +
            '<text class="vl" x="' +
            x(pts.length - 1).toFixed(1) +
            '" y="' +
            ly.toFixed(1) +
            '">' +
            last.pct +
            "%</text>" +
            xl +
            "</svg>"
          );
        }
        function viewResults() {
          const ss = S.sessions.slice().sort((a, b) => a.ts - b.ts);

            best = ss.length
              ? Math.max.apply(

          const measured = TOPICS.map((t) => ({ t, m: mastery(t.id) }))
            .filter((x) => x.m != null)
            .sort((a, b) => b.m - a.m);
          const strong = measured.filter((x) => x.m >= 80).slice(0, 3),
            weak = measured
              .filter((x) => x.m < 80)
              .slice(-3)
              .reverse();
          const kindLabel = (s) =>

              ? "Diagnostika"

                ? "Zaif mavzular"
                : TOPIC_BY_ID[s.items[0].topicId].title;
          return (
            (S.demo ? demoBanner() : "") +
            '<section class="hero"><p class="eyebrow">Natijalar</p><h1>Sizning <span class="mk">o‘sishingiz</span></h1></section>' +
            '<section class="card strip"><div><span class="eyebrow">Topshirilgan testlar</span><span class="big">' +
            ss.length +
            "</span></div>" +
            '<div><span class="eyebrow">O‘rtacha natija</span><span class="big">' +
            (avg == null ? "—" : avg + "%") +
            "</span></div>" +
            '<div><span class="eyebrow">Eng yaxshi natija</span><span class="big">' +
            (best == null ? "—" : best + "%") +
            "</span></div>" +
            '<div><span class="eyebrow">O‘rganilgan mavzular</span><span class="big">' +
            Object.keys(S.learned).length +
            " / " +
            TOPICS.length +
            "</span></div></section>" +
            '<section class="card"><h2 style="margin-bottom:12px">Test natijalari dinamikasi</h2>' +
            (ss.length
              ? '<div class="chartwrap">' +
                chartSVG(
                  ss
                    .slice(-12)
                    .map((s) => ({
                      pct: Math.round((100 * s.right) / s.total),
                      label: shortDate(s.ts),
                    })),
                ) +
                "</div>"
              : '<p class="muted">Hali test topshirilmagan. Birinchi testdan keyin grafik shu yerda paydo bo‘ladi.</p>') +
            "</section>" +
            '<div class="grid2"><section class="card"><h3 style="margin-bottom:6px">Kuchli tomonlar</h3>' +
            (strong.length
              ? strong
                  .map(
                    (x) =>
                      '<div class="mrow" style="grid-template-columns:1fr auto"><span>' +
                      esc(x.t.title) +
                      "</span>" +
                      pillFor(x.m) +
                      "</div>",
                  )
                  .join("")
              : '<p class="muted">80% va undan yuqori natijali mavzu hozircha yo‘q.</p>') +
            "</section>" +
            '<section class="card"><h3 style="margin-bottom:6px">Mustahkamlash kerak</h3>' +
            (weak.length
              ? weak
                  .map(
                    (x) =>
                      '<div class="mrow" style="grid-template-columns:1fr auto"><a href="#dars-' +
                      x.t.id +
                      '">' +
                      esc(x.t.title) +
                      "</a>" +
                      pillFor(x.m) +
                      "</div>",
                  )
                  .join("")
              : '<p class="muted">Zaif mavzu topilmadi.</p>') +
            "</section></div>" +
            '<section class="card"><h2 style="margin-bottom:6px">Barcha mavzular</h2>' +
            TOPICS.map((t) => {
              const m = mastery(t.id);
              return (
                '<div class="mrow"><span><span class="dot" style="--c:' +
                SUBJ_BY_ID[t.subject].c +
                ';display:inline-block;margin-right:8px"></span>' +
                esc(t.title) +
                "</span>" +
                bar(m, SUBJ_BY_ID[t.subject].c) +
                '<span class="mono muted" style="text-align:right">' +
                (m == null ? "—" : m + "%") +
                "</span></div>"
              );
            }).join("") +
            "</section>" +
            '<section class="card"><h2 style="margin-bottom:6px">Test tarixi</h2>' +
            (ss.length
              ? '<div class="tablewrap"><table><thead><tr><th>Sana</th><th>Test</th><th class="n">To‘g‘ri</th><th class="n">Foiz</th></tr></thead><tbody>' +
                ss
                  .slice()
                  .reverse()
                  .slice(0, 15)
                  .map(
                    (s) =>
                      '<tr><td class="mono">' +
                      shortDate(s.ts) +
                      "</td><td>" +
                      esc(kindLabel(s)) +
                      '</td><td class="n">' +
                      s.right +
                      "/" +
                      s.total +
                      '</td><td class="n">' +
                      Math.round((100 * s.right) / s.total) +
                      "%</td></tr>",
                  )
                  .join("") +
                "</tbody></table></div>"
              : '<p class="muted">Tarix bo‘sh.</p>') +
            "</section>"
          );
        }

        let resetArmed = false;
        function viewProfile() {
          const p = S.profile,
            ss = SUBJECTS.map((s) => ({ s, m: subjectMastery(s.id) }));
          const meas = ss.filter((x) => x.m != null).sort((a, b) => b.m - a.m);
          const initial = (p.name || "O").trim().charAt(0).toUpperCase();
          return (
            (S.demo ? demoBanner() : "") +
            '<section class="row" style="gap:18px"><div class="avatar" aria-hidden="true">' +
            esc(initial) +
            '</div><div><p class="eyebrow">Shaxsiy o‘quv profili</p><h1>' +
            esc(p.name || "O‘quvchi") +
            "</h1></div></section>" +
            '<form class="card stack" id="pform"><h2>Ma’lumotlar</h2><div class="form">' +
            '<div class="field"><label for="pf-name">Ism</label><input id="pf-name" name="name" value="' +
            esc(p.name) +
            '" maxlength="40" autocomplete="given-name" placeholder="Ismingiz"></div>' +
            '<div class="field"><label for="pf-grade">Sinf</label><select id="pf-grade" name="grade">' +
            [5, 6, 7, 8, 9, 10, 11]
              .map(
                (g) =>
                  '<option value="' +
                  g +
                  '"' +
                  (+p.grade === g ? " selected" : "") +
                  ">" +
                  g +
                  "-sinf</option>",
              )
              .join("") +
            "</select></div>" +
            '<div class="field"><label for="pf-goal">Haftalik maqsad (mavzu)</label><input id="pf-goal" name="goal" type="number" min="1" max="12" value="' +
            p.weeklyGoal +
            '"></div>' +
            '<div class="field"><label for="pf-focus">Asosiy fan</label><select id="pf-focus" name="focus">' +
            SUBJECTS.map(
              (s) =>
                '<option value="' +
                s.id +
                '"' +
                (p.focus === s.id ? " selected" : "") +
                ">" +
                s.name +
                "</option>",
            ).join("") +
            "</select></div></div>" +
            '<div class="row"><button class="btn primary" type="submit">Saqlash</button><span class="note" id="pform-note" role="status"></span></div></form>' +
            '<section class="card"><h2 style="margin-bottom:6px">O‘quv darajasi</h2>' +
            ss
              .map(
                (x) =>
                  '<div class="subj"><div class="name"><span class="dot" style="--c:' +
                  x.s.c +
                  '"></span>' +
                  x.s.name +
                  "</div>" +
                  bar(x.m, x.s.c) +
                  '<span class="mono muted" style="text-align:right">' +
                  (x.m == null ? "—" : x.m + "%") +
                  "</span></div>",
              )
              .join("") +
            '<p class="muted" style="margin-top:12px">' +
            (meas.length
              ? "Eng kuchli fan: <b>" +
                meas[0].s.name +
                "</b>" +
                (meas.length > 1
                  ? ". Ko‘proq e’tibor kerak: <b>" +
                    meas[meas.length - 1].s.name +
                    "</b>."
                  : ".")
              : "Daraja aniqlanishi uchun birinchi testni topshiring.") +
            " Ketma-ket faol kunlar: <b>" +
            streak() +
            "</b>.</p></section>" +
            '<section class="card flat stack"><h3>Ma’lumotlarni boshidan boshlash</h3><p class="muted">Barcha test natijalari, o‘rganilgan mavzular va suhbat tarixi shu qurilmadan o‘chiriladi.</p>' +
            '<div class="row"><button class="btn danger" type="button" data-act="reset">' +
            (resetArmed ? "Ha, hammasini o‘chirish" : "Hammasini o‘chirish") +
            "</button>" +
            (resetArmed
              ? '<button class="btn" type="button" data-act="reset-cancel">Bekor qilish</button>'
              : "") +
            "</div></section>"
          );
        }

        function bubble(m) {
          return (
            '<div class="msg ' +
            (m.role === "user" ? "u" : "a") +
            '">' +
            fmt(m.content) +
            "</div>"
          );
        }
        function viewTutor() {
          const opts =
            '<option value="">Umumiy savol</option>' +
            TOPICS.map(
              (t) =>
                '<option value="' +
                t.id +
                '"' +
                (tutor.topic === t.id ? " selected" : "") +
                ">" +
                esc(subjName(t.subject)) +
                " · " +
                esc(t.title) +
                "</option>",
            ).join("");
          const chips = [
            "Mavzuni juda sodda qilib tushuntir",
            "Menga misol keltir",
            "Meni tekshir",
            "Xatolarim sababi nima?",
          ];
          return (
            '<section class="hero"><p class="eyebrow">AI Tutor</p><h1>Tushunmagan joyingizni <span class="mk">so‘rang</span></h1><p class="lead">Mavzuni tanlang va savol bering. Tutor sodda tilda tushuntiradi va sizni tekshiradi.</p></section>' +
            '<section class="card tutor"><div class="row between"><div class="field" style="min-width:220px;flex:1;max-width:380px"><label for="tutor-topic">Mavzu</label><select id="tutor-topic">' +
            opts +
            "</select></div>" +
            '<button class="btn small" type="button" data-act="clear-chat">Suhbatni tozalash</button></div>' +
            '<div class="chat" id="chat" aria-live="polite">' +
            (chat.length
              ? chat.map(bubble).join("")
              : '<div class="empty"><h3>Salom! Men sizning AI Tutoringizman.</h3><p class="muted">Quyidagi tugmalardan birini bosing yoki o‘z savolingizni yozing.</p></div>') +
            "</div>" +
            '<div class="chips">' +
            chips
              .map(
                (c) =>
                  '<button class="chip" type="button" data-act="chip" data-text="' +
                  esc(c) +
                  '" aria-pressed="false">' +
                  c +
                  "</button>",
              )
              .join("") +
            "</div>" +
            '<form class="composer" id="cform"><textarea id="chat-input" rows="1" placeholder="Savolingizni yozing..." aria-label="Savol"></textarea>' +
            '<button class="btn primary" type="submit" id="send-btn">Yuborish</button><button class="btn" type="button" data-act="stop" id="stop-btn" hidden>To‘xtatish</button></form>' +
            '<p class="note" id="prov-note">AI holati tekshirilmoqda...</p></section>'
          );
        }
        function notFound() {
          return '<section class="hero"><h1>Sahifa topilmadi</h1><p class="lead">Bunday mavzu yo‘q.</p></section><div><a class="btn primary" href="#bosh">Bosh sahifaga</a></div>';
        }

        /* ================= MARSHRUT ================= */
        function parseRoute() {
          const h = (location.hash || "#bosh").slice(1);
          if (h.indexOf("dars-") === 0)
            return { name: "dars", id: h.slice(5), nav: "darslar" };
          if (h.indexOf("test-") === 0)
            return { name: "test", id: h.slice(5), nav: "testlar" };
          return { name: h, nav: h };
        }
        function renderNav(active) {
          const html = NAV.map(
            (n) =>
              '<a href="#' +
              n.h +
              '"' +
              (n.h === active ? ' aria-current="page"' : "") +
              '><svg viewBox="0 0 24 24" aria-hidden="true"><path d="' +
              ICONS[n.h] +
              '"/></svg><span>' +
              "</span></a>",
          );
          $("#nav").innerHTML = NAV.map((n, i) =>
            html[i].replace("<span></span>", "<span>" + n.t + "</span>"),
          ).join("");
          $("#tabbar").innerHTML = NAV.map((n, i) =>
            html[i].replace("<span></span>", "<span>" + n.s + "</span>"),
          ).join("");
        }
        function render() {
          const r = parseRoute(),
            v = $("#view");
          if (tutor.ctl && r.name !== "tutor") {
            tutor.ctl.abort();
          }
          let html;
          switch (r.name) {
            case "bosh":
              html = viewHome();
              break;
            case "darslar":
              html = viewLessons();
              break;
            case "dars":
              html = viewLesson(r.id);
              break;
            case "testlar":
              html = viewTests();
              break;
            case "test":
              html = viewTest(r.id);
              break;
            case "natijalar":
              html = viewResults();
              break;
            case "profil":
              html = viewProfile();
              break;
            case "tutor":
              html = viewTutor();
              break;
            default:
              html = notFound();
          }
          v.innerHTML = html;
          renderNav(r.nav);
          if (r.name === "tutor") initTutor();
        }
        window.addEventListener("hashchange", () => {
          window.scrollTo(0, 0);
          render();
        });

        /* ================= AI TUTOR MANTIG‘I ================= */
        function initTutor() {
          const chatEl = $("#chat");
          if (chatEl) chatEl.scrollTop = chatEl.scrollHeight;
          getProvider().then((p) => {
            const el = $("#prov-note");
            if (!el) return;
            el.textContent = p
              ? p.kind === "claude"
                ? "AI Tutor ulangan. Javoblar Claude orqali yaratiladi."
                : "AI Tutor serverga ulanadi. Server javob bermasa, dars materiallari asosida oflayn javob beriladi."
              : "AI serveri ulanmagan. Tutor hozircha dars materiallari asosida oflayn javob beradi (README: server.js ni ishga tushiring).";
          });
          if (tutor.pending) {
            const p = tutor.pending;
            tutor.pending = null;
            send(p);
          }
        }
        function setBusy(b) {
          tutor.busy = b;
          const s = $("#send-btn"),
            x = $("#stop-btn");
          if (s) s.disabled = b;
          if (x) x.hidden = !b;
        }
        async function send(text) {
          text = String(text || "").trim();
          if (!text || tutor.busy) return;
          const topic = TOPIC_BY_ID[tutor.topic] || null;
          chat.push({ role: "user", content: text });
          const box = $("#chat");
          if (!box) return;
          const empty = box.querySelector(".empty");
          if (empty) empty.remove();
          box.insertAdjacentHTML(
            "beforeend",
            bubble({ role: "user", content: text }),
          );
          box.insertAdjacentHTML(
            "beforeend",
            '<div class="msg a" id="live"><span class="dots"><span></span><span></span><span></span></span></div>',
          );
          const live = $("#live");
          box.scrollTop = box.scrollHeight;
          setBusy(true);
          tutor.ctl = new AbortController();
          let reply = "",
            partial = "";
          try {
            const prov = await getProvider();
            if (prov) {
              const hist = chat.slice(-12);
              while (hist.length && hist[0].role !== "user") hist.shift();
              try {
                reply = await callAI(prov, buildSystem(topic), hist, {
                  signal: tutor.ctl.signal,
                  onText: (t) => {
                    partial = t;
                    if (live.isConnected) {
                      live.innerHTML = fmt(t);
                      box.scrollTop = box.scrollHeight;
                    }
                  },
                });
              } catch (e) {
                if (
                  (e && e.code === "cancelled") ||
                  (e && e.name === "AbortError")
                )
                  throw e;
                reply =
                  localTutor(text, topic) +
                  "\n\n_(AI serveriga ulanib bo‘lmadi, shuning uchun dars materiallari asosida javob berildi.)_";
                reply = reply.replace(/_\((.+?)\)_/, "$1");
              }
            } else {
              reply = localTutor(text, topic);
            }
            chat.push({ role: "assistant", content: reply });
            if (live.isConnected) {
              live.id = "";
              live.innerHTML = fmt(reply);
            }
          } catch (e) {
            const keep = (e && e.text) || partial;
            if (keep) {
              chat.push({ role: "assistant", content: keep });
              if (live.isConnected) {
                live.id = "";
                live.innerHTML = fmt(keep);
              }
            } else {
              chat.pop();
              if (live.isConnected) live.remove();
            }
          } finally {
            saveChat();
            tutor.ctl = null;
            setBusy(false);
            const b = $("#chat");
            if (b) b.scrollTop = b.scrollHeight;
          }
        }

        /* ================= HODISALAR ================= */
        document.addEventListener("click", (e) => {
          const el = e.target.closest("[data-act]");
          if (!el) return;
          const act = el.dataset.act,
            id = el.dataset.id;
          switch (act) {
            case "theme": {
              const root = document.documentElement,
                cur =
                  root.dataset.theme ||
                  (matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark"
                    : "light");
              root.dataset.theme = cur === "dark" ? "light" : "dark";
              LS.set("smartedu.theme", root.dataset.theme);
              break;
            }
            case "clear-demo":
              S.sessions = [];
              S.learned = {};
              S.demo = false;
              save();
              render();
              break;
            case "filter":
              lessonFilter = id;
              render();
              break;
            case "learned":
              leaveDemo();
              if (S.learned[id]) delete S.learned[id];
              else S.learned[id] = Date.now();
              save();
              render();
              break;
            case "explain":
              goTutor(id, "Bu mavzuni menga juda sodda qilib tushuntirib ber.");
              break;
            case "pick": {
              if (!run || run.picked != null) break;
              const cur = run.qs[run.i],
                q = TOPIC_BY_ID[cur.topicId].questions[cur.qi],
                i = +el.dataset.i;
              run.picked = i;
              run.results.push({
                topicId: cur.topicId,
                qi: cur.qi,
                ok: i === q.correct,
              });
              render();
              break;
            }
            case "next":
              if (run) {
                run.i++;
                run.picked = null;
                window.scrollTo(0, 0);
                render();
              }
              break;
            case "retry": {
              const k = run && run.key;
              run = null;
              if (k) {
                startRun(k);
                render();
              }
              break;
            }
            case "explain-wrong": {
              const wr = run.results.filter((r) => !r.ok);
              tutor.lastWrong = wr.map((r) => ({
                topicId: r.topicId,
                qi: r.qi,
              }));
              const list = wr
                .map((r, i) => {
                  const q = TOPIC_BY_ID[r.topicId].questions[r.qi];
                  return (
                    i +
                    1 +
                    ") " +
                    q.q +
                    " (to‘g‘ri javob: " +
                    q.options[q.correct] +
                    ")"
                  );
                })
                .join("\n");
              goTutor(
                wr.length === 1 ? wr[0].topicId : "",
                "Quyidagi savollarda xato qildim. Har birini sodda tushuntirib ber, nega bu javob to‘g‘ri ekanini ko‘rsat:\n" +
                  list,
              );
              break;
            }
            case "practice":
              makePractice();
              break;
            case "reset":
              if (!resetArmed) {
                resetArmed = true;
                render();
              } else {
                S = {
                  demo: false,
                  profile: S.profile,
                  learned: {},
                  sessions: [],
                };
                chat = [];
                run = null;
                practice.items = [];
                practice.status = "idle";
                resetArmed = false;
                save();
                saveChat();
                render();
              }
              break;
            case "reset-cancel":
              resetArmed = false;
              render();
              break;
            case "chip":
              send(el.dataset.text);
              break;
            case "stop":
              if (tutor.ctl) tutor.ctl.abort();
              break;
            case "clear-chat":
              chat = [];
              saveChat();
              tutor.pendingQ = null;
              render();
              break;
          }
        });
        document.addEventListener("submit", (e) => {
          if (e.target.id === "pform") {
            e.preventDefault();
            const f = new FormData(e.target);
            leaveDemo();
            S.profile = {
              name: String(f.get("name") || "")
                .trim()
                .slice(0, 40),
              grade: +f.get("grade") || 8,
              weeklyGoal: Math.min(12, Math.max(1, +f.get("goal") || 4)),
              focus: String(f.get("focus") || "math"),
            };
            save();
            const n = $("#pform-note");
            if (n) n.textContent = "Saqlandi.";
            const av = $(".avatar");
            if (av)
              av.textContent = (S.profile.name || "O").charAt(0).toUpperCase();
            const h1 = $("h1");
            if (h1) h1.textContent = S.profile.name || "O‘quvchi";
          } else if (e.target.id === "cform") {
            e.preventDefault();
            const ta = $("#chat-input");
            const v = ta.value;
            ta.value = "";
            ta.style.height = "";
            send(v);
          }
        });
        document.addEventListener("change", (e) => {
          if (e.target.id === "tutor-topic") tutor.topic = e.target.value;
        });
        document.addEventListener("keydown", (e) => {
          if (
            e.target.id === "chat-input" &&
            e.key === "Enter" &&
            !e.shiftKey &&
            !e.isComposing
          ) {
            e.preventDefault();
            $("#cform").requestSubmit();
          }
        });
        document.addEventListener("input", (e) => {
          if (e.target.id === "chat-input") {
            e.target.style.height = "auto";
            e.target.style.height = Math.min(140, e.target.scrollHeight) + "px";
          }
        });

        /* ================= BOSHLASH ================= */
        const th = LS.get("smartedu.theme", null);
        if (th) document.documentElement.dataset.theme = th;
        render();
      })();
    </script>
  </body>
</html>
